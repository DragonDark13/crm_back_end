name: Backend Tests

on:
  push:

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-tests:
    name: Authorization integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run authorization and product creation tests
        run: |
          python -m pytest -v tests/test_authorization.py tests/test_product_creation.py
